# Cloudflare Workers — arsvibe (free *.workers.dev subdomain; no custom domain needed)
# Git-connected build settings (dashboard → Settings → Build):
#   Build command:  node scripts/build.mjs
#   Deploy command: npx wrangler deploy        (the default)
name = "arsvibe"
main = "cloudflare/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[triggers]
# Daily: full-site scanner. Every 5 minutes: the Telegram bot watchdog
# (each live bot's webhook verified with Telegram, healed if drifted).
crons = ["0 3 * * *", "*/5 * * * *"]

# Durable documents (bot records, comments, the repair ledger) in
# Cloudflare KV. No id on purpose: Wrangler provisions the namespace on
# deploy, so state survives cold starts with nothing left to attach.
[[kv_namespaces]]
binding = "ARS_KV"

# The catalogue gzip is imported by lib/catalog.mjs where no filesystem
# exists (Workers); on Node the same file is read from disk as before.
[[rules]]
type = "Data"
globs = ["**/data/batches.json.gz"]
fallthrough = true
