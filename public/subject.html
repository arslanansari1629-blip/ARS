<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Subject — ArsVibe PW</title>
<meta name="theme-color" content="#eef1f5" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="ArsVibe" />
<meta property="og:title" content="ArsVibe — every Physics Wallah batch, notes & DPPs" />
<meta property="og:description" content="Browse every PW batch, chapter and lecture, read the class notes, and watch in a clean ad-free player." />
<meta property="og:image" content="https://arsvibe-pw-sepia.vercel.app/assets/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://arsvibe-pw-sepia.vercel.app/assets/og.png" />
<link rel="stylesheet" href="/assets/arsvibe.css" />
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/assets/icon.png" />
</head>
<body data-page="subject">

<header class="nav" id="nav">
  <div class="shell nav-inner">
    <a class="brand" href="/">
      <img class="brand-img" src="/assets/logo.svg" alt="ArsVibe" width="30" height="30" />
      <span>ArsVibe<small>Physics Wallah</small></span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav class="nav-links" id="navLinks">
      <a href="/" data-page="home">Home</a>
      <a href="/batches.html" data-page="batches">Batches</a>
      <a href="/favourites.html" data-page="favourites">Favourites</a>
      <a href="/library.html" data-page="library">My Library</a>
      <a href="/dashboard.html" data-page="dashboard">Dashboard</a>
    </nav>
    <div class="nav-actions" id="sessionChip"></div>
  </div>
</header>

<main class="section">
  <div class="shell">
    <div class="crumbs" id="crumbs">
      <a href="/">Home</a> <span>/</span> <a href="/batches.html">Batches</a>
    </div>

    <div class="page-head">
      <div>
        <span class="eyebrow">Chapters</span>
        <h1 id="subjectName">Loading…</h1>
        <p id="subjectMeta">Loading the chapter list…</p>
      </div>
      <a class="btn btn-ghost btn-sm" id="batchLink" href="#">Batch overview</a>
    </div>

    <!-- A PW subject runs to 20+ chapters. Without a filter that is a scroll,
         not a list, so the count and the field sit above it. -->
    <div class="list-tools" id="listTools" hidden>
      <label class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/></svg>
        <input type="search" id="chapterFilter" placeholder="Filter chapters…" aria-label="Filter chapters" autocomplete="off" />
      </label>
      <span class="tiny dim" id="filterCount"></span>
    </div>

    <div id="list"></div>
  </div>
</main>

<footer class="footer">
  <div class="shell footer-inner">
    <div><strong>ArsVibe PW</strong> · data streamed live from the ArsVibe PW catalogue</div>
    <div class="row"><a href="/batches.html">All batches</a></div>
  </div>
</footer>

<script type="module" src="/assets/subject.js"></script>
<script type="module" src="/assets/shell.mjs"></script>
<script type="module" src="/assets/ui.js"></script>
</body>
</html>
