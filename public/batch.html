<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Batch — ArsVibe PW</title>
<link rel="icon" href="/assets/pw-mark.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/assets/theme.css" />
<link rel="stylesheet" href="/assets/pages.css" />
<link rel="stylesheet" href="/assets/ui.css" />
<link rel="stylesheet" href="/assets/shell.css" />
</head>
<body data-page="batch">
<div class="aurora" aria-hidden="true"></div>
<div class="grid-veil" aria-hidden="true"></div>

<header class="nav" id="nav">
  <div class="shell nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark">AV</span>
      <span>ArsVibe<small>Physics Wallah</small></span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav class="nav-links" id="navLinks">
      <a href="/" data-page="home">Home</a>
      <a href="/batches.html" data-page="batches">Batches</a>
      <a href="/library.html" data-page="library">My Library</a>
      <a href="/dashboard.html" data-page="dashboard">Dashboard</a>
    </nav>
    <div class="nav-actions" id="sessionChip"></div>
  </div>
</header>

<main>
  <section class="detail-hero">
    <div class="detail-bg" id="detailBg"></div>
    <div class="shell">
      <div class="crumbs" style="padding-top:1.1rem">
        <a href="/">Home</a> <span>/</span> <a href="/batches.html">Batches</a> <span>/</span>
        <span id="crumbName" class="truncate">Batch</span>
      </div>
      <div class="detail-grid" id="detailGrid">
        <div class="skeleton" style="aspect-ratio:1/1;border-radius:18px"></div>
        <div class="stack">
          <div class="skeleton sk-line" style="width:35%"></div>
          <div class="skeleton sk-line" style="width:70%;height:26px"></div>
          <div class="skeleton sk-line" style="width:55%"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:1.6rem">
    <div class="shell">
      <div class="row between section-head">
        <div>
          <span class="eyebrow">Subjects</span>
          <h2 style="font-size:1.35rem">Pick a subject to start</h2>
        </div>
        <div class="row" style="gap:.4rem">
          <button class="tab active" data-tab="subjects">Subjects</button>
          <button class="tab" data-tab="announcements">Announcements</button>
          <button class="tab" data-tab="about">About</button>
        </div>
      </div>

      <div id="tabBody"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="shell footer-inner">
    <div><strong>ArsVibe PW</strong> · data streamed live from the ArsVibe PW catalogue</div>
    <div class="row"><a href="/batches.html">All batches</a><a href="/library.html">Library</a></div>
  </div>
</footer>

<script type="module" src="/assets/batch.js"></script>
<script type="module" src="/assets/shell.mjs"></script>
<script type="module" src="/assets/ui.js"></script>
</body>
</html>
