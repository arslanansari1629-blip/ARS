<header class="nav" id="nav">

    <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">

<main id="main" class="section">
  <div class="shell">
    <div class="crumbs"><a href="/">Home</a> <span>/</span> <span>All batches</span></div>

    <div class="page-head">
      <div>
        <h1>All Physics Wallah batches</h1>
        <p id="resultCount">Loading the catalogue…</p>
      </div>
      <a class="btn btn-ghost btn-sm" href="/">Back to home</a>
    </div>

    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input class="input" id="searchInput" type="search" placeholder="Search batches by name…" />
      </div>
      <select class="select" id="langFilter">
        <option value="">All languages</option>
      </select>
      <select class="select" id="priceFilter" aria-label="Filter by price">
        <option value="all">Any price</option>
        <option value="free">Free only</option>
        <option value="paid">Paid only</option>
      </select>
      <select class="select" id="sortBy" aria-label="Sort batches">
        <option value="default">Catalogue order</option>
        <option value="name">Name (A–Z)</option>
        <option value="newest">Newest start date</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
      </select>
      <button class="btn btn-ghost btn-sm" id="resetBtn">Reset</button>
    </div>

    <div class="grid grid-batches" id="grid"></div>
    <div class="pager" id="pager"></div>
  </div>
</main>

<footer class="footer">
  <div class="shell footer-inner">
