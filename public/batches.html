<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>All Batches — EduVibe PW</title>
<meta name="description" content="Browse and search every Physics Wallah batch by name, language and class." />
<link rel="icon" href="/assets/pw-mark.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/assets/theme.css" />
<link rel="stylesheet" href="/assets/pages.css" />
</head>
<body data-page="batches">

<header class="nav" id="nav">
  <div class="shell nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark">PW</span>
      <span>EduVibe<small>Physics Wallah</small></span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav class="nav-links" id="navLinks">
      <a href="/" data-page="home">Home</a>
      <a href="/batches.html" data-page="batches">Batches</a>
      <a href="/library.html" data-page="library">My Library</a>
      <a href="/dashboard.html" data-page="dashboard">Dashboard</a>
    </nav>
    <div class="nav-actions" id="sessionChip"></div>
  </div>
</header>

<main class="section" style="padding-top:1.6rem">
  <div class="shell">
    <div class="crumbs"><a href="/">Home</a> <span>/</span> <span>All batches</span></div>

    <div class="row between" style="margin:.8rem 0 1.2rem;align-items:flex-end">
      <div>
        <h1 style="font-size:clamp(1.6rem,3.4vw,2.3rem)">All Physics Wallah batches</h1>
        <p class="muted tiny" id="resultCount">Loading the catalogue…</p>
      </div>
    </div>

    <div class="card" style="padding:.75rem;display:flex;gap:.55rem;flex-wrap:wrap;align-items:center">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input class="input" id="searchInput" type="search" placeholder="Search batches by name…" />
      </div>
      <select class="select" id="langFilter" style="max-width:190px">
        <option value="">All languages</option>
      </select>
      <select class="select" id="sortBy" style="max-width:190px">
        <option value="default">Catalogue order</option>
        <option value="name">Name (A–Z)</option>
        <option value="newest">Newest start date</option>
      </select>
      <button class="btn btn-ghost btn-sm" id="resetBtn">Reset</button>
    </div>

    <div class="grid grid-batches" id="grid" style="margin-top:1.1rem"></div>
    <div class="pager" id="pager"></div>
  </div>
</main>

<footer class="footer">
  <div class="shell footer-inner">
    <div><strong>EduVibe PW</strong> · live catalogue from the EduVibe PW source</div>
    <div class="row"><a href="/">Home</a><a href="/library.html">Library</a></div>
  </div>
</footer>

<script type="module" src="/assets/batches.js"></script>
</body>
</html>
