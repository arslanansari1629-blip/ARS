<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Library — ArsVibe PW</title>
<link rel="icon" href="/assets/pw-mark.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/assets/theme.css" />
<link rel="stylesheet" href="/assets/pages.css" />
<link rel="stylesheet" href="/assets/ui.css" />
<link rel="stylesheet" href="/assets/shell.css" />
</head>
<body data-page="library">
<div class="aurora" aria-hidden="true"></div>
<div class="grid-veil" aria-hidden="true"></div>

<header class="nav" id="nav">
  <div class="shell nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark">AV</span>
      <span>ArsVibe<small>Physics Wallah</small></span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav class="nav-links" id="navLinks">
      <a href="/" data-page="home">Home</a>
      <a href="/batches.html" data-page="batches">Batches</a>
      <a href="/library.html" data-page="library">My Library</a>
      <a href="/dashboard.html" data-page="dashboard">Dashboard</a>
    </nav>
    <div class="nav-actions" id="sessionChip"></div>
  </div>
</header>

<main class="section" style="padding-top:1.5rem">
  <div class="shell">
    <div class="page-head">
      <div>
        <span class="eyebrow">Saved on this device</span>
        <h1>My library</h1>
        <p>Batches you opened, lectures in progress and PDFs you viewed.</p>
      </div>
      <button class="btn btn-ghost btn-sm" id="clearBtn">Clear all</button>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="batches">Batches</button>
      <button class="tab" data-tab="lectures">Lectures</button>
      <button class="tab" data-tab="docs">PDFs</button>
    </div>

    <div id="body" style="margin-top:1rem"></div>
  </div>
</main>

<footer class="footer">
  <div class="shell footer-inner">
    <div><strong>ArsVibe PW</strong> · your library stays on this device</div>
    <div class="row"><a href="/batches.html">All batches</a></div>
  </div>
</footer>

<script type="module" src="/assets/library-page.js"></script>
<script type="module" src="/assets/shell.mjs"></script>
