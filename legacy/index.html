<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <title>ARSxedit · Document Scanner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="logo" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="2"
              d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
        <path fill="currentColor" d="M9 13h6v1H9zm0-3h6v1H9zm0 6h4v1H9z"/>
      </svg>
      <span class="brand-name">ARS<span class="accent">x</span>edit</span>
    </div>
    <div class="topbar-status">
      <span id="pageCounter" class="chip">0 pages</span>
      <button id="clearBtn" class="icon-btn" title="Clear all pages" aria-label="Clear all pages">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Camera / viewfinder stage -->
    <section class="stage">
      <video id="video" autoplay playsinline muted></video>

      <!-- Neon tracking overlay: exactly outlines the detected paper -->
      <svg id="tracker" class="tracker" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <polygon id="trackerPoly" points="" fill="rgba(0,255,209,0.08)" stroke="#00ffd1" stroke-width="0.6"/>
      </svg>

      <div id="scanlines" class="scanlines" aria-hidden="true"></div>
      <div id="statusToast" class="toast">Initializing camera…</div>

      <canvas id="snapCanvas" hidden></canvas>
    </section>

    <!-- Control deck -->
    <section class="deck glass">
      <div class="capture-row">
        <button id="captureBtn" class="btn btn-primary" disabled aria-label="Capture page">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>
          </svg>
          <span>Capture</span>
        </button>

        <label class="switch" title="Auto-capture when the page is steady">
          <input type="checkbox" id="autoToggle" />
          <span class="slider"></span>
          <span class="switch-label">Auto</span>
        </label>

        <button id="makePdfBtn" class="btn btn-accent" disabled aria-label="Make PDF">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
            <path d="M12 11v6M9 14l3 3 3-3"/>
          </svg>
          <span>Make PDF</span>
        </button>
      </div>

      <div class="hint">Point the rear camera at a document on a darker surface.</div>
    </section>
  </main>

  <!-- Non-intrusive PDF download trigger -->
  <a id="pdfLink" hidden></a>

  <script src="{{ url_for('static', filename='js/scanner.js') }}"></script>
</body>
</html>
